[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "projector-control"
version = "0.1.0"
description = "Small PJLink power controller"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
projector = "projector_control.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
projector_control = ["config.example.toml"]
